version: '3.8'

services:
  landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    image: scalex-landing:dev
    container_name: scalex-landing-dev
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    labels:
      - "com.scalex.service=landing-page"
      - "com.scalex.environment=development"
