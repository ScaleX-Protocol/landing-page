version: '3.8'

services:
  landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    image: scalex-landing:latest
    container_name: scalex-landing
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.scalex.service=landing-page"
      - "com.scalex.description=ScaleX Landing Page"

networks:
  default:
    name: scalex-network
