name: Base Sepolia Landing Page CI/CD

on:
  push:
    branches: [base-sepolia]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'nginx.conf'
  pull_request:
    branches: [base-sepolia]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'nginx.conf'
  workflow_dispatch:

env:
  CHAIN: base-sepolia
  DOMAIN: base-sepolia.scalex.money
  IMAGE_NAME: scalex-landing-base-sepolia

jobs:
  # Lint and Type Check for Base Sepolia
  lint:
    name: Lint & Type Check (Base Sepolia Landing)
    runs-on: [self-hosted, scalex]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node
        
      - name: Run Astro check
        run: pnpm exec astro check || true
        continue-on-error: true

  # Build Application for Base Sepolia
  build:
    name: Build Landing Page (Base Sepolia)
    runs-on: [self-hosted, scalex]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node
        
      - name: Build Astro static site
        run: pnpm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files-base-sepolia-landing
          path: dist/
          retention-days: 1
          compression-level: 9

  # Security Audit
  security:
    name: Security Audit (Base Sepolia Landing)
    runs-on: [self-hosted, scalex]
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js with caching
        uses: ./.github/actions/setup-node
        
      - name: Run security audit
        run: pnpm audit --audit-level moderate || echo "⚠️ Some vulnerabilities found, review recommended"

  # Deploy to Base Sepolia
  deploy-base-sepolia:
    name: Deploy Landing to Base Sepolia
    runs-on: [self-hosted, scalex]
    needs: [build]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/base-sepolia' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    environment: base-sepolia
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Deploy to production
        run: |
          echo "🚀 Deploying Base Sepolia landing page..."
          
          # Clean up Docker resources to prevent disk space issues
          echo "=== Cleaning Docker resources ==="
          docker system prune -f --volumes || true
          docker image prune -a -f --filter "until=24h" || true
          
          echo "=== Building Base Sepolia landing Docker image ==="
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} . || {
            echo "❌ Build failed, checking build logs..."
            exit 1
          }
          
          echo "=== Stopping existing container ==="
          docker stop scalex-landing-base-sepolia 2>/dev/null || true
          docker rm scalex-landing-base-sepolia 2>/dev/null || true
          
          echo "=== Starting Base Sepolia landing container ==="
          docker run -d \
            --name scalex-landing-base-sepolia \
            --restart unless-stopped \
            -p 80:80 \
            --health-cmd="wget --quiet --tries=1 --spider http://localhost/health || exit 1" \
            --health-interval=30s \
            --health-timeout=10s \
            --health-retries=3 \
            --health-start-period=10s \
            --label "com.scalex.service=landing-base-sepolia" \
            --label "com.scalex.chain=base-sepolia" \
            $IMAGE_NAME:latest || {
              echo "❌ Container start failed"
              docker logs scalex-landing-base-sepolia 2>/dev/null || true
              exit 1
            }
          
          echo "=== Waiting for container to be ready ==="
          sleep 10
          docker ps --filter "name=scalex-landing-base-sepolia"
            
      - name: Show Container Logs
        run: |
          echo "=========================================="
          echo "📋 CONTAINER LOGS AND STATUS"
          echo "=========================================="
          
          echo ""
          echo "=== 1. CONTAINER STATUS ==="
          docker ps --filter "name=scalex-landing-base-sepolia" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          echo ""
          echo "=== 2. CONTAINER LOGS (last 50 lines) ==="
          docker logs --tail=50 scalex-landing-base-sepolia 2>&1 || echo "No logs available"
          
          echo ""
          echo "=== 3. STARTUP VERIFICATION ==="
          CONTAINER_ID=$(docker ps -q --filter "name=scalex-landing-base-sepolia")
          if [ -n "$CONTAINER_ID" ]; then
            echo "✅ Landing container is running: $CONTAINER_ID"
            
            # Check container startup time
            STARTED_AT=$(docker inspect --format='{{.State.StartedAt}}' $CONTAINER_ID)
            echo "Container started at: $STARTED_AT"
            
            # Check if nginx is responding internally
            echo "Testing internal health endpoint..."
            if docker exec scalex-landing-base-sepolia wget --quiet --tries=1 --spider http://localhost/health 2>/dev/null; then
              echo "✅ Internal health check passed"
            else
              echo "⚠️ Internal health check failed - container may still be starting"
            fi
          else
            echo "❌ Landing container is NOT running"
            docker ps -a --filter "name=scalex-landing-base-sepolia"
            exit 1
          fi
          
          echo ""
          echo "=== 4. SYSTEM RESOURCES ==="
          echo "Available disk space:"
          df -h | grep -E "(Filesystem|/dev/)" || true
          echo ""
          echo "Docker system info:"
          docker system df
          
      - name: Run Base Sepolia health check
        run: |
          echo ""
          echo "=========================================="
          echo "🌐 EXTERNAL HEALTH CHECKS"
          echo "=========================================="
          sleep 15
          
          # Check health endpoint
          echo "--- Testing Health Endpoint ---"
          for attempt in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://$DOMAIN/health || echo "000")
            echo "Attempt $attempt: HTTP $response"
            
            if [ "$response" = "200" ]; then
              echo "✅ Base Sepolia Landing health check passed (HTTP $response)"
              break
            else
              echo "⏳ Health check failed (HTTP $response) - retrying in 10s..."
              sleep 10
              
              if [ $attempt -eq 5 ]; then
                echo "❌ Health check failed after 5 attempts (HTTP $response)"
                echo "Debugging - checking container logs:"
                docker logs --tail=20 scalex-landing-base-sepolia 2>&1 || true
                echo "Debugging - checking container status:"
                docker ps -a --filter "name=scalex-landing-base-sepolia"
                exit 1
              fi
            fi
          done
          
          # Check main application with redirect following
          echo ""
          echo "--- Testing Main Page ---"
          main_response=$(curl -s -L -o /dev/null -w "%{http_code}" https://$DOMAIN || echo "000")
          if [ "$main_response" = "200" ]; then
            echo "✅ Base Sepolia Landing main page check passed (HTTP $main_response)"
          else
            echo "⚠️ Base Sepolia Landing main page check: HTTP $main_response"
          fi
          
          # Performance check
          echo ""
          echo "--- Performance Check ---"
          start_time=$(date +%s%N)
          curl -s https://$DOMAIN > /dev/null || true
          end_time=$(date +%s%N)
          response_time=$(( ($end_time - $start_time) / 1000000 ))
          echo "📊 Base Sepolia Landing response time: ${response_time}ms"
          
      - name: Verify Container Status
        run: |
          echo "=========================================="
          echo "🔍 FINAL CONTAINER VERIFICATION"
          echo "=========================================="
          
          echo ""
          echo "=== CONTAINER STATUS CHECK ==="
          docker ps --filter "name=scalex-landing-base-sepolia" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
          
          CONTAINER_ID=$(docker ps -q --filter "name=scalex-landing-base-sepolia")
          if [ -n "$CONTAINER_ID" ]; then
            echo ""
            echo "✅ Landing container is healthy and running"
            
            echo ""
            echo "=== CONTAINER STATS ==="
            docker stats --no-stream scalex-landing-base-sepolia || true
            
            echo ""
            echo "=== DEPLOYMENT COMPLETE ==="
            echo "🎉 Successfully deployed to https://$DOMAIN"
          else
            echo "❌ Landing container is NOT running"
            docker logs scalex-landing-base-sepolia 2>&1 || true
            exit 1
          fi